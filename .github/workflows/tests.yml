name: Tests

on:
  push:
  pull_request:

concurrency:
  group: cache-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: redis, apcu
          ini-values: apc.enable_cli=1
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer dump-autoload --optimize --strict-psr
      - run: composer style
      - run: composer phpstan
      - name: Start auxiliary Redis instances
        run: |
          docker run --rm -d --name omega-cache-auth -p 6380:6379 redis:7-alpine redis-server --appendonly no --requirepass omega-secret
          docker run --rm -d --name omega-cache-failure -p 6381:6379 redis:7-alpine
      - run: composer test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_AUTH_PORT: 6380
          REDIS_FAILURE_PORT: 6381
      - if: always()
        run: docker stop omega-cache-auth omega-cache-failure || true
      - run: composer audit
